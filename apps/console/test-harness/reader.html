<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Card reader frame harness</title></head>
<body>
<!--
  Test harness for the card reader (docs/19), served by the Vite dev server inside
  src/lib/cards/reader.frame.test.ts. It draws synthetic scenes (white cards with printed indices on a
  green felt, with a chip stack and a hand-coloured block as distractors) and runs the real OpenCV.js
  pipeline on them. Not part of the console build.
-->
<canvas id="felt" width="1280" height="720"></canvas>
<script type="module">
  import { loadCv } from '/src/lib/cards/opencv.ts';
  import { readCards } from '/src/lib/cards/reader.ts';
  const SUIT = { s: '♠', h: '♥', d: '♦', c: '♣' };
  /** Draws the felt with cards ("Ah", "Ts", …) at the given centres and rotations (degrees). */
  window.drawScene = (cards) => {
    const c = document.getElementById('felt'), g = c.getContext('2d');
    g.fillStyle = '#1f5f3a'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#c0392b'; g.beginPath(); g.arc(1100, 600, 60, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#e8c39e'; g.fillRect(40, 560, 220, 120);
    for (const { card, x, y, rot } of cards) {
      const rank = card.slice(0, -1).replace('T', '10'), suit = card.slice(-1);
      g.save(); g.translate(x, y); g.rotate((rot * Math.PI) / 180);
      g.fillStyle = '#fff'; g.beginPath(); g.roundRect(-95, -133, 190, 266, 10); g.fill();
      g.fillStyle = suit === 'h' || suit === 'd' ? '#d10f1f' : '#111';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = 'bold 56px Arial'; g.fillText(rank, -95 + 30, -133 + 36);
      g.font = '56px Arial'; g.fillText(SUIT[suit], -95 + 30, -133 + 92);
      g.font = '110px Arial'; g.fillText(SUIT[suit], 0, 10);
      g.restore();
    }
  };
  window.runReader = async () => {
    const cv = await loadCv();
    return readCards(cv, document.getElementById('felt'));
  };
  window.harnessReady = true;
</script>
</body></html>
