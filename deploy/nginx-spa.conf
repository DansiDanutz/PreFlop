# One config for the three SPAs (web, console, table). Each image copies its own header files
# (generated from deploy/security-headers.mjs, see the Dockerfile) to /etc/nginx/preflop/:
#   headers.conf        every path
#   embed.headers.conf  /embed/… (the web app's partner widget: frameable by https: sites)
# add_header in a location replaces the server's, so every location includes its header file.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  location /assets/ {
    include /etc/nginx/preflop/headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # The service worker must be revalidated on every load so a new deployment takes over.
  location = /sw.js {
    include /etc/nginx/preflop/headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Served in place (rewrite … break), not through try_files: an internal redirect to /index.html
  # would fall into "location /" and pick up its frame-ancestors 'none'.
  location /embed {
    include /etc/nginx/preflop/embed.headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /index.html break;
  }

  location / {
    include /etc/nginx/preflop/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
