# Staging API (+ in-process worker) on Fly.io — docs/18-staging.md.
# Deploy from the repo root: flyctl deploy --config deploy/fly/api.toml --dockerfile Dockerfile --remote-only
app = "preflop-staging-api"
primary_region = "fra"

[build]
  build-target = "api"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  # One proxy hop (Fly's edge): the client address is the last one it appended, never one the client sent.
  TRUST_PROXY = "1"
  RUN_WORKER = "true"
  LOG = "1"
  # The three staging sites, each Vercel preview deployment's unique URL (<project>-<hash>-<team>.vercel.app),
  # and the native apps (apps/mobile): capacitor://localhost on iOS, https://localhost on Android.
  CORS_ORIGINS = "capacitor://localhost,https://localhost,https://preflop-staging-web.vercel.app,https://preflop-staging-console.vercel.app,https://preflop-staging-table.vercel.app,https://preflop-staging-web-*-irises-projects-ce549f63.vercel.app,https://preflop-staging-console-*-irises-projects-ce549f63.vercel.app,https://preflop-staging-table-*-irises-projects-ce549f63.vercel.app"
  # The database's TLS certificate (Supabase) is verified against Supabase's CA, baked into the image.
  NODE_EXTRA_CA_CERTS = "/srv/supabase-ca.crt"
  # Secrets (set by the "Fly secrets" workflow, never committed): DATABASE_URL — the Supabase *direct*
  # connection (db.<ref>.supabase.co:5432, IPv6) with ?sslmode=verify-full.

[http_service]
  internal_port = 4000
  force_https = true
  # The worker (settlement sweeps, leaderboards, tournaments) and WebSockets must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
