# Staging simulated tables on Fly.io — docs/18-staging.md. No public service.
# Deploy from the repo root: flyctl deploy --config deploy/fly/sim.toml --dockerfile Dockerfile --remote-only
# On a fresh machine it re-seeds its tables and rotates their keys (idempotent), so no volume is needed.
app = "preflop-staging-sim"
primary_region = "fra"

[build]
  build-target = "sim"

[env]
  API_URL = "https://preflop-staging-api.fly.dev"
  BETTING_WINDOW_MS = "20000"
  NODE_EXTRA_CA_CERTS = "/certs/supabase-ca.crt"
  # Secrets (fly secrets set, or the "Fly secrets" workflow): DATABASE_URL (the same Supabase URL as
  # the API), ADMIN_EMAIL and ADMIN_PASSWORD (the first console admin, seeded on first run).

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
