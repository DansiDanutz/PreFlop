name: Deploy staging

# Deploys the API (+ worker) and the simulated tables to Fly.io after CI passes on main.
# The website, console and club tablet deploy themselves through Vercel's Git integration.
# See docs/18-staging.md. Needs the repository secret FLY_API_TOKEN; without it the job is skipped.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04 # SEM-161: retain the validated OS during the Ubuntu 26.04 migration.
    env:
      # Pinned flyctl release, verified against its published checksum before it runs.
      FLYCTL_VERSION: 0.4.111
      FLYCTL_SHA256: 1878d7fb1f8a418039042cf0749e4b7216c6c7018b66ae10611a64c2b6d9aa9e
    steps:
      # The Fly token is given only to the steps that need it, never to the installer.
      - name: Check for the Fly token
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set; skipping the staging deploy (docs/18-staging.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install flyctl
        if: steps.token.outputs.ok == 'true'
        run: |
          curl -fsSL -o /tmp/flyctl.tgz "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  /tmp/flyctl.tgz" | sha256sum -c -
          mkdir -p "$HOME/.fly/bin" && tar -xzf /tmp/flyctl.tgz -C "$HOME/.fly/bin" flyctl
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version
      - name: Deploy the API
        if: steps.token.outputs.ok == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/fly/api.toml --dockerfile Dockerfile --remote-only --wait-timeout 600
      - name: Deploy the simulated tables
        if: steps.token.outputs.ok == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/fly/sim.toml --dockerfile Dockerfile --remote-only --wait-timeout 600
      - name: Smoke check
        if: steps.token.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://preflop-staging-api.fly.dev/v1/health/ready; then exit 0; fi
            sleep 6
          done
          echo "API not ready after deploy" >&2
          exit 1
      # End to end, against the deployed environment: register → open round in the lobby → stream
      # events → a play bet settles and the wallet moves → the three sites serve the app. Node only,
      # no dependencies (scripts/staging-smoke.mjs).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
      # The sites must serve the build of the deployed commit, or of a later commit on main: Vercel
      # builds them from every push to main, deploys queue here (cancel-in-progress is off), so a
      # newer push may already be live while this run finishes, and that push's own run checks it.
      # The smoke test asks git on every poll (a push landing mid-check is accepted too), and
      # anything git cannot answer keeps it waiting until it fails: never a skipped check. A manual
      # run of another ref deploys only the Fly services; its sites are checked for being up only.
      - name: Which commit the sites must serve
        if: steps.token.outputs.ok == 'true'
        id: expected
        env:
          DEPLOYED: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || (github.ref == 'refs/heads/main' && github.sha) || '' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYED" ]; then
            echo "not a deploy of main: the sites are checked for being up only"
            exit 0
          fi
          # Full history of main: the checkout is shallow, and ancestry must hold however far main
          # advanced while this deploy waited in the queue (the repository is small).
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --quiet --unshallow origin main; else git fetch --quiet origin main; fi
          if ! git merge-base --is-ancestor "$DEPLOYED" origin/main; then
            echo "::error::deployed commit $DEPLOYED is not on main"
            exit 1
          fi
          echo "commit=$DEPLOYED" >> "$GITHUB_OUTPUT"
      - name: End-to-end smoke test
        if: steps.token.outputs.ok == 'true'
        env:
          EXPECTED_COMMIT: ${{ steps.expected.outputs.commit }}
          ACCEPT_NEWER_ON: ${{ steps.expected.outputs.commit && 'origin/main' || '' }}
        run: node scripts/staging-smoke.mjs
