name: Deploy staging

# Deploys the API (+ worker) and the simulated tables to Fly.io after CI passes on main.
# The website, console and club tablet deploy themselves through Vercel's Git integration.
# See docs/18-staging.md. Needs the repository secret FLY_API_TOKEN; without it the job is skipped.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the Fly token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set; skipping the staging deploy (docs/18-staging.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install flyctl
        if: steps.token.outputs.ok == 'true'
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Deploy the API
        if: steps.token.outputs.ok == 'true'
        run: flyctl deploy --config deploy/fly/api.toml --dockerfile Dockerfile --remote-only --wait-timeout 600
      - name: Deploy the simulated tables
        if: steps.token.outputs.ok == 'true'
        run: flyctl deploy --config deploy/fly/sim.toml --dockerfile Dockerfile --remote-only --wait-timeout 600
      - name: Smoke check
        if: steps.token.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://preflop-staging-api.fly.dev/v1/health/ready; then exit 0; fi
            sleep 6
          done
          echo "API not ready after deploy" >&2
          exit 1
