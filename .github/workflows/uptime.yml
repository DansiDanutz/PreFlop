name: Uptime

# Probes the staging API and the three sites every 15 minutes. A failure fails the run (GitHub
# emails the repository owner about failed scheduled runs) and opens, or adds to, one issue labelled
# "uptime"; the next healthy run closes it. See docs/18-staging.md §Smoke test and uptime.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      API_URL: https://preflop-staging-api.fly.dev
      SITES: https://preflop-staging-web.vercel.app https://preflop-staging-console.vercel.app https://preflop-staging-table.vercel.app
    steps:
      - name: Probe
        id: probe
        run: |
          set +e
          problems=""
          probe() { # name url expected-grep
            for i in 1 2 3; do
              body=$(curl -sS -m 20 -w '\n%{http_code}' "$2" 2>&1); code=$(echo "$body" | tail -n1)
              if [ "$code" = "200" ] && echo "$body" | grep -q -- "$3"; then echo "ok   $1 ($2)"; return 0; fi
              sleep 10
            done
            echo "DOWN $1 ($2): HTTP $code"
            problems="$problems- **$1** ($2): HTTP $code"$'\n'
          }
          probe "API readiness" "$API_URL/v1/health/ready" '"ok":true'
          for s in $SITES; do probe "Site" "$s" 'id="root"'; done
          {
            echo "problems<<EOF"
            printf '%s' "$problems"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -z "$problems" ]
      - name: Open or update the incident issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMS: ${{ steps.probe.outputs.problems }}
        run: |
          gh label create uptime --color B60205 --description "Staging outage detected by the Uptime workflow" --force >/dev/null 2>&1 || true
          # The workflow owns only the issue carrying its marker: other issues with the label are left alone.
          marker='<!-- preflop-uptime-incident -->'
          body="$marker"$'\n'"Detected by the Uptime workflow at $(date -u +'%Y-%m-%d %H:%M UTC') ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})):"$'\n\n'"$PROBLEMS"$'\n'"Check \`fly status\` / \`fly logs\` (deploy/fly) and the Vercel dashboard. This issue closes itself on the next healthy probe."
          existing=$(gh issue list --label uptime --state open --json number,body --jq "[.[] | select(.body | contains(\"$marker\"))][0].number")
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Staging is down" --label uptime --body "$body"; fi
      - name: Close the incident issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker='<!-- preflop-uptime-incident -->'
          for n in $(gh issue list --label uptime --state open --json number,body --jq "[.[] | select(.body | contains(\"$marker\"))][].number"); do
            gh issue close "$n" --comment "Healthy again at $(date -u +'%Y-%m-%d %H:%M UTC') (every probe passed)."
          done
