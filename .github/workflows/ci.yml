name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its running checks; pushes to main each run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04 # SEM-161: retain the validated OS during the Ubuntu 26.04 migration.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser tests: the card reader's frame test (apps/console/src/lib/cards/reader.frame.test.ts) and the
      # manual-table flow end to end (apps/api/test/e2e-manual-table.test.ts) run in a real Chromium.
      - run: pnpm --filter @preflop/console exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Production builds require the API origin (no localhost fallback in a shipped bundle).
          VITE_API_URL: http://localhost:4000
      - run: pnpm --filter @preflop/odds-engine smoke

  # The images Fly builds on deploy (deploy/fly/*.toml): a broken Dockerfile fails the pull request,
  # not the staging deploy. The sim target extends the shared build stage, so the second build reuses it.
  docker:
    runs-on: ubuntu-24.04 # SEM-161: retain the validated OS during the Ubuntu 26.04 migration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build --target api -t preflop-api:ci .
      - run: docker build --target sim -t preflop-sim:ci .
