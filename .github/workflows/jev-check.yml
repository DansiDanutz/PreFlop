name: Jev check

# Run by hand: asks the decision model (docs/20) one reading-check question with the repository
# secret JEV_API_KEY, the same request shape the API sends, and prints the HTTP status and whether
# the answer came back. Read-only, costs one call. The key never appears in the log.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask one question
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_API_URL: https://api.typesafe.ai/v1/systemone
        run: |
          set -u
          if [ -z "$JEV_API_KEY" ]; then echo "No repository secret JEV_API_KEY (Settings → Secrets and variables → Actions)."; exit 1; fi
          echo "::add-mask::$JEV_API_KEY"
          body='{"model":"jev-latest","state":{"card":"Ah","match_confidence":0.87,"runner_up_margin":0.12},"questions":[{"key":"accept","type":"noul","question":"Is a match of this confidence and runner-up margin sure enough to pre-fill the card?"}]}'
          code=$(curl -sS -m 30 -o /tmp/jev.json -w '%{http_code}' -X POST "$JEV_API_URL" \
            -H "authorization: Bearer $JEV_API_KEY" -H 'content-type: application/json' -H 'accept: application/json' \
            --data "$body") || { echo "request failed"; exit 1; }
          echo "HTTP $code"
          case "$code" in
            200) if grep -q '"accept"' /tmp/jev.json; then echo "answer present: the key works"; else echo "200 but no 'accept' answer:"; head -c 400 /tmp/jev.json; echo; exit 1; fi ;;
            401|403) echo "the key is refused"; exit 1 ;;
            *) head -c 400 /tmp/jev.json; echo; exit 1 ;;
          esac
