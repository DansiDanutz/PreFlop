name: Fly secrets

# Run by hand: sets one secret on the staging Fly apps (docs/18-staging.md), for when nobody has a
# local flyctl. The value is masked in the log, but GitHub keeps a run's inputs readable by anyone
# with access to the repository's Actions, so a value passed here should be one that can be rotated.
# Setting a secret restarts the app's machines with the new value.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Secret name
        type: choice
        options: [DATABASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD, SMTP_URL, MAIL_FROM]
        default: DATABASE_URL
      value:
        description: Secret value
        type: string
        required: true
      apps:
        description: Which apps
        type: choice
        options: [both, preflop-staging-api, preflop-staging-sim]
        default: both

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLYCTL_VERSION: 0.4.111
      FLYCTL_SHA256: 1878d7fb1f8a418039042cf0749e4b7216c6c7018b66ae10611a64c2b6d9aa9e
    steps:
      - name: Mask the value
        env:
          VALUE: ${{ inputs.value }}
        run: echo "::add-mask::$VALUE"
      - name: Install flyctl
        run: |
          curl -fsSL -o /tmp/flyctl.tgz "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  /tmp/flyctl.tgz" | sha256sum -c -
          mkdir -p "$HOME/.fly/bin" && tar -xzf /tmp/flyctl.tgz -C "$HOME/.fly/bin" flyctl
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Set the secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NAME: ${{ inputs.name }}
          VALUE: ${{ inputs.value }}
          APPS: ${{ inputs.apps }}
        run: |
          set -eu
          if [ "$APPS" = both ]; then apps="preflop-staging-api preflop-staging-sim"; else apps="$APPS"; fi
          for app in $apps; do
            echo "Setting $NAME on $app"
            flyctl secrets set "$NAME=$VALUE" -a "$app"
          done
